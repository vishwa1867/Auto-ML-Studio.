<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroForge</title>
  <style>
    /* GLOBAL SETTINGS */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Arial', sans-serif;
      scroll-behavior: smooth;
      overflow-x: hidden;
      background: #000;
      color: #e5e7eb;
    }

    /* Background Video */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 4vw;
      backdrop-filter: blur(12px);
      background: rgba(0, 10, 25, 0.85);
      border-bottom: 1px solid rgba(0, 150, 255, 0.2);
      position: sticky;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

    .nav-logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #00aaff;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      font-size: 1rem;
    }

    .nav-links a {
      color: #e5e7eb;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .nav-links a:hover {
      color: #00aaff;
      transform: translateY(-2px);
    }

    .nav-buttons {
      display: flex;
      gap: 1rem;
    }

    .btn-gradient {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      background: linear-gradient(90deg, #000428, #004e92);
      color: #fff;
      transition: all 0.3s ease;
    }

    .btn-gradient:hover {
      opacity: 0.9;
      transform: scale(1.05);
    }

    /* APP LAYOUT */
    .app-container {
      display: flex;
      min-height: 100vh;
      width: 100%;
      padding-top: 0; /* nav bar is optional if you want */
    }

    /* Sidebar (VS Code style) */
    .sidebar {
      width: 250px;
      background: rgba(0, 10, 25, 0.9);
      backdrop-filter: blur(10px);
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      border-right: 1px solid rgba(0,150,255,0.2);
    }

    .sidebar h2 {
      color: #00aaff;
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .sidebar ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .sidebar ul li {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 1rem;
      color: #e5e7eb;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .sidebar ul li:hover {
      background: rgba(0, 80, 150, 0.5);
    }

    .sidebar ul li img {
      width: 24px;
      height: 24px;
    }

    /* Workspace */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 2rem;
      gap: 1.5rem;
    }

    .editor {
      flex: 1;
    }

    textarea#editor {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      padding: 1rem;
      border: 1px solid rgba(0,150,255,0.3);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-family: monospace;
      font-size: 1rem;
      resize: vertical;
    }

    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .controls button {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      border: none;
      font-weight: 500;
      cursor: pointer;
      background: linear-gradient(90deg, #000428, #004e92);
      color: #fff;
      transition: all 0.3s ease;
    }

    .controls button:hover {
      opacity: 0.9;
      transform: scale(1.05);
    }

    /* HERO & WORKFLOW style inside workspace if needed */
    .hero-box {
      background: rgba(0, 0, 0, 0.75);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      width: 100%;
      margin-bottom: 2rem;
    }

    .workflow-step {
      background: linear-gradient(135deg, rgba(0, 10, 25, 0.9), rgba(0, 80, 150, 0.85));
      color: #fff;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      text-align: center;
      font-weight: 500;
      border: 1px solid rgba(0,150,255,0.3);
      box-shadow: 0 4px 15px rgba(0,150,255,0.2);
      transition: transform 0.3s ease, background 0.3s ease;
      min-width: 200px;
      margin-bottom: 1rem;
    }

    .workflow-step:hover {
      transform: translateY(-4px);
      background: linear-gradient(135deg, rgba(0, 15, 35, 0.95), rgba(0, 120, 200, 0.95));
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .app-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
        border-right: none;
        border-bottom: 1px solid rgba(0,150,255,0.2);
      }
      .workspace {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Background Video -->
  <video autoplay muted loop id="bg-video">
    <source src="assets/bg-video.mp4" type="video/mp4">
  </video>

  <!-- Main UI Container -->
  <div class="app-container">
    <!-- Sidebar (VS Code style) -->
    <div class="sidebar">
      <h2>⚡ NeuroForge</h2>
      <ul>
        <li><img src="assets/cnn.svg"> Choose NN</li>
        <li><img src="assets/gpt.svg"> Auto-Code</li>
        <li><img src="assets/settings.svg"> Settings</li>
      </ul>
    </div>

    <!-- Main Workspace -->
    <div class="workspace">
      <div class="hero-box">
        <h1>Welcome to <span>NeuroForge</span></h1>
        <p>Your AI code generator & neural network playground.</p>
      </div>

      <div class="editor">
        <textarea id="editor" placeholder="Generated Notebook Code will appear here..."></textarea>
      </div>
      <div class="controls">
        <button onclick="generateCode()">⚙️ Generate</button>
        <button onclick="downloadNotebook()">📥 Download .ipynb</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
