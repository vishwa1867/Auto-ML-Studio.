<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Data Extractor</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
background: url("{{ url_for('static', filename='files/1.jpg') }}") no-repeat center center fixed;
  background-size: cover;      background-size: cover;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.0);
      z-index: -1;
    }
    nav {
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0; left: 0;
      z-index: 1000;
    }
    nav .logo { font-size: 20px; font-weight: bold; color: #00aaff; }
    nav ul { list-style: none; display: flex; gap: 20px; }
    nav ul li a { color: #fff; text-decoration: none; transition: 0.3s; }
    nav ul li a:hover { color: #00aaff; }

    .container {
      background: rgba(0,0,0,0.85);
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 900px;
      margin: 120px auto 40px auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    h1 { text-align: center; color: #00aaff; margin-bottom: 30px; }
    .upload-form { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
    .file-input { padding: 12px; border: 2px dashed #00aaff; border-radius: 8px; background: rgba(0,0,0,0.6); color: #fff; width: 100%; }
    .supported-formats { font-size: 12px; color: #ccc; margin-top: 5px; }
    .upload-btn, #askGptBtn, #nextStepBtn {
      padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer;
      font-weight: 500; font-size: 16px; transition: 0.3s; color: #fff;
    }
    .upload-btn { background: linear-gradient(90deg, #000428, #004e92); }
    #askGptBtn { background: linear-gradient(90deg, #006400, #28a745); margin-top: 15px; }
    #nextStepBtn { background: linear-gradient(90deg, #ff7e5f, #feb47b); margin-top: 25px; width: 100%; }

    .loading { display: none; text-align: center; margin: 20px 0; color: #00aaff; }
    .loading.show { display: block; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #00aaff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #output, #gptResponse {
      margin-top: 20px; padding: 20px; border-radius: 10px;
      background: rgba(0,0,0,0.6); color: #fff; max-height: 500px; overflow-y: auto;
      font-family: monospace;
    }
    #gptResponse { display: none; background: rgba(255,255,0,0.2); border: 1px solid #ffeeba; }

    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; color: #fff; }
    th { background-color: rgba(0,170,255,0.3); }
    tr:nth-child(even) { background-color: rgba(0,0,0,0.4); }

    .result-section { margin-top: 20px; }
    .result-section h3 { color: #00aaff; border-bottom: 2px solid #00aaff; padding-bottom: 5px; }
    .entity-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
    .entity-item { background-color: rgba(0,170,255,0.2); padding: 5px 10px; border-radius: 15px; font-size: 12px; border: 1px solid #00aaff; }
  </style>
</head>
<body>

  <nav>
    <div class="logo">📄 Data Extractor</div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#output">Results</a></li>
      <li><a href="#gptResponse">Ask GPT</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1>📄 Document Data Extractor</h1>
    <form class="upload-form" id="uploadForm" enctype="multipart/form-data">
      <input type="file" name="file" class="file-input" accept=".csv" required>
      <div class="supported-formats">Supported: CSV (Max: 16MB)</div>
      <button type="submit" class="upload-btn" id="uploadBtn">📤 Upload and Extract</button>
    </form>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>Processing file... Please wait.</div>
    </div>

    <div id="output"></div>

    <button id="askGptBtn">🤖 Ask GPT for Best Model</button>
    <div id="gptResponse"></div>

    <button id="nextStepBtn" onclick="goToStep2()">➡️ Go to Step-2</button>
  </div>

  <script>
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const outputDiv = document.getElementById("output");
      const loadingDiv = document.getElementById("loading");
      const uploadBtn = document.getElementById("uploadBtn");

      loadingDiv.classList.add("show");
      uploadBtn.disabled = true;
      outputDiv.innerHTML = "";

      try {
        const res = await fetch("/", { method: "POST", body: formData });
        const result = await res.json();

        if (res.ok && result.success) {
          displayResults(result.data, result.filename);
        } else {
          outputDiv.innerHTML = `<div style="color:red">Error: ${result.error}</div>`;
        }
      } catch (err) {
        outputDiv.innerHTML = `<div style="color:red">Network error: ${err.message}</div>`;
      } finally {
        loadingDiv.classList.remove("show");
        uploadBtn.disabled = false;
      }
    });

    // GPT Button
    document.getElementById("askGptBtn").addEventListener("click", async () => {
      const outputDiv = document.getElementById("output");
      const gptDiv = document.getElementById("gptResponse");
      const text = outputDiv.textContent.trim();
      if (!text) return alert("Upload a dataset first!");

      gptDiv.style.display = "block";
      gptDiv.innerHTML = "Thinking...";

      try {
        const res = await fetch("/ask-gpt", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const result = await res.json();
        if (res.ok && result.success) {
          gptDiv.innerHTML = `<pre>${result.reply}</pre>`;
        } else {
          gptDiv.innerHTML = `<div style="color:red">Error: ${result.error}</div>`;
        }
      } catch (err) {
        gptDiv.innerHTML = `<div style="color:red">Network error: ${err.message}</div>`;
      }
    });

   function goToStep2() {
  // Optional: show alert
  alert("Now moving to Step-2 🚀");
  // Redirect to Flask app running on port 5001
  window.location.href = "http://127.0.0.1:5001/";
}


    function displayResults(data, filename) {
      const outputDiv = document.getElementById("output");
      let html = `<div class="result-section">`;
      html += `<h3>📁 File: ${filename || 'Uploaded CSV'}</h3>`;

      // Entities
      if (data.entities) {
        html += `<div class="result-section"><h3>🔍 Extracted Entities</h3>`;
        for (const [key, list] of Object.entries(data.entities)) {
          if (list.length > 0) {
            html += `<strong>${key.charAt(0).toUpperCase()+key.slice(1)}:</strong><div class="entity-list">`;
            list.forEach(item => html += `<span class="entity-item">${item}</span>`);
            html += `</div>`;
          }
        }
        html += `</div>`;
      }

      // Tables
      if (data.tables && data.tables.length > 0) {
        html += `<div class="result-section"><h3>📊 Tables Found</h3>`;
        data.tables.forEach((table, index) => {
          html += `<h4>Table ${index + 1}</h4><table>`;
          if (table.headers) {
            html += `<tr>`;
            table.headers.forEach(header => html += `<th>${header}</th>`);
            html += `</tr>`;
          }
          if (table.rows) {
            table.rows.forEach(row => {
              html += `<tr>`;
              row.forEach(cell => html += `<td>${cell}</td>`);
              html += `</tr>`;
            });
          }
          html += `</table>`;
        });
        html += `</div>`;
      }

      // Raw JSON
      html += `<div class="result-section"><h3>📋 Raw Data <button onclick="toggleRawData()" style="margin-left:10px;font-size:12px;">Toggle</button></h3>`;
      html += `<pre id="rawData" style="display:none;background:rgba(255,255,255,0.1);padding:10px;border-radius:5px;overflow-x:auto;">${JSON.stringify(data,null,2)}</pre></div>`;
      html += `</div>`;
      outputDiv.innerHTML = html;
    }

    function toggleRawData() {
      const raw = document.getElementById("rawData");
      raw.style.display = raw.style.display === "none" ? "block" : "none";
    }
  </script>
</body>
</html>
